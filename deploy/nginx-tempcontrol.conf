# Host nginx server block for TempControl.
#
# Add as /etc/nginx/sites-available/tempcontrol, symlink into sites-enabled,
# then `nginx -t` and `systemctl reload nginx`.
#
# RELOAD, never restart, and never take :80/:443 for this app alone — the same
# nginx serves strotech.uz and parizodam.uz on this machine.

server {
    listen 80;
    listen [::]:80;
    server_name tempcontrol.example.uz;   # replace with the real domain

    # certbot --nginx -d tempcontrol.example.uz  adds the TLS block below itself,
    # touching only this file and only this domain.

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the session cookie never gets its Secure flag in production.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # Next.js fingerprints these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
